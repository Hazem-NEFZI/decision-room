<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decision Room · How does a smart team make bad decisions?</title>
<meta name="description" content="A team decision tool built on the question: how does a smart team make bad decisions? Share, Challenge, Decide, Learn.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e4572e'/%3E%3Cpath d='M16 6 8 10.5v9L16 24l8-4.5v-9z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --side:#15171f;--side2:#222531;--sink:#ece9e2;--smut:#9093a0;
  --bg:#f4f1ea;--panel:#fffdf8;--sunk:#efebe2;--line:#e2ddd1;--line2:#ece8de;
  --ink:#1b1c22;--ink2:#54555e;--ink3:#86868f;
  --acc:#e4572e;--acc2:#c9441d;--accs:#fbe4db;
  --ok:#23895a;--oks:#dcf0e4;--warn:#b07a0c;--warns:#f7ebcd;--bad:#cf3f25;--bads:#f9ddd5;--blue:#3b5bcc;--blues:#e1e7fa;
  --go:#2e9e6a;--hold:#d99a1c;--no:#d8492f;
  --display:"Fraunces",Cambria,Georgia,serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Calibri,sans-serif;
  --r:14px;--shadow:0 1px 2px rgba(27,28,34,.05),0 6px 18px rgba(27,28,34,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181d;--panel:#1f2027;--sunk:#191a20;--line:#30323b;--line2:#292b33;--ink:#ecebe6;--ink2:#b5b4ba;--ink3:#868690;
  --accs:#3a231c;--oks:#17321f;--warns:#3a2f14;--bads:#3b1d17;--blues:#1d2540;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181d;--panel:#1f2027;--sunk:#191a20;--line:#30323b;--line2:#292b33;--ink:#ecebe6;--ink2:#b5b4ba;--ink3:#868690;
  --accs:#3a231c;--oks:#17321f;--warns:#3a2f14;--bads:#3b1d17;--blues:#1d2540;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--display);font-size:26px;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:20px}
h3{font-size:14.5px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.mut{color:var(--ink2)}.dim{color:var(--ink3)}.small{font-size:12.5px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.shell{height:100dvh;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--side);color:var(--sink);display:flex;flex-direction:column;padding:16px 12px;gap:3px;min-height:0;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px;border:0;background:none;color:inherit;text-align:left}
.mark{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px;color:#fff}
.brand b{font-family:var(--display);font-size:18px;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--smut);font-size:11.5px}
.navlabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--smut);padding:10px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--sink);padding:8px 10px;border-radius:9px;text-align:left;font-weight:500;width:100%}
.nav:hover{background:var(--side2)}
.nav[aria-current="page"]{background:var(--side2);box-shadow:inset 3px 0 0 var(--acc)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:10px;padding:1px 7px}
.nav .cnt.q{background:#3a3e4c;color:var(--sink)}
.nav.sub{padding-left:22px;font-size:13px;color:#cfccc4}
.nav .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--side2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.me b{display:block;font-size:13px;line-height:1.2}.me small{color:var(--smut);font-size:11.5px}
.switch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid #333745;background:transparent;color:var(--sink);font-size:12.5px;width:100%;text-align:left}
.switch:hover{background:var(--side2)}
.side select{background:var(--side2);border:1px solid #333745;color:var(--sink);border-radius:8px;padding:6px 8px;width:100%;font-size:12.5px}
.status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--smut);padding:6px 10px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.off i{background:var(--hold)}

.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0;
  padding:18px 22px 16px;padding-right:max(22px,env(safe-area-inset-right,0px));padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));gap:14px}
.head{display:flex;align-items:flex-end;gap:12px 18px;flex-wrap:wrap;justify-content:space-between}
.head .l{min-width:0;flex:1 1 300px}
.head .sub{color:var(--ink2);font-size:13.5px;margin-top:3px;max-width:80ch}
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:2px}
.crumb button{border:0;background:none;padding:0;color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.page{min-height:0;display:grid;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel .hint{font-size:12.5px;color:var(--ink2);margin-top:-6px}
.grow{flex:1 1 0;min-height:0}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.ai{background:linear-gradient(135deg,#2b2f45,#15171f);border-color:#2b2f45;color:#fff}
.btn.ai .ic{color:#ffb59e}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:11px 18px;font-size:14.5px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--ink3);font-size:17px;line-height:1;padding:2px 4px;border-radius:6px}.x:hover{color:var(--bad);background:var(--bads)}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.field{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;transition:border-color .15s}
.field:focus{border-color:var(--acc);outline:none}
textarea.field{resize:none;line-height:1.45}
select.field{width:auto;padding:6px 9px}
::placeholder{color:var(--ink3);opacity:1}
label.lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.add{display:flex;gap:6px;flex-wrap:wrap}.add .field{flex:1 1 160px;width:auto}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.warn{background:var(--warns);color:var(--warn)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.acc{background:var(--accs);color:var(--acc2)}.pill.blue{background:var(--blues);color:var(--blue)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.vote button[aria-pressed="true"]{color:#fff}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px 10px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .n{font-size:11px;background:var(--sunk);border-radius:9px;padding:0 6px;color:var(--ink2)}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper span{font-size:12px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stepper span b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1.5px solid var(--line);color:var(--ink3)}
.stepper span.done{color:var(--ok)}.stepper span.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper span.on{color:var(--ink)}.stepper span.on b{background:var(--acc);border-color:var(--acc);color:#fff}
.stepper i{width:18px;height:1.5px;background:var(--line)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px;gap:2px}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi .s{font-size:12px;color:var(--ink3)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--sunk)}
table.t td.title{font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:grid;gap:7px;align-content:start}
.list li{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}
.list li.soft{background:var(--sunk);border-color:transparent}
.list li.done{opacity:.6}
.list .t{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.list .by{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.pager{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}
.pager button{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:24px;height:24px;display:grid;place-items:center;padding:0}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;text-align:center}
.bar{height:8px;background:var(--sunk);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--acc);transition:width .3s}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:12px}.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{--p:0;--c:var(--acc);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>span{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px}
.ring.lg{width:84px;height:84px}.ring.lg>span{width:66px;height:66px;font-size:22px}
.ring.sm{width:34px;height:34px}.ring.sm>span{width:26px;height:26px;font-size:10.5px}
.alert{padding:10px 12px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warns)}.alert.bad{background:var(--bads)}.alert.ok{background:var(--oks)}.alert.info{background:var(--blues)}
.alert .ic{margin-top:1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border:0;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left}
.check:hover{background:var(--sunk)}
.check .dotc{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);margin-top:1px}
.check.ok .dotc{background:var(--ok);border-color:var(--ok);color:#fff}
.check b{font-size:13.5px;display:block}.check small{color:var(--ink3);font-size:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 8px;text-align:center;font-weight:700;font-size:15px;transition:all .15s;min-width:0}
.opt small{display:block;font-weight:500;font-size:12px;color:var(--ink3);margin-top:2px}
.opts{display:grid;gap:8px}
.scale{display:flex;gap:5px}.scale button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 0;font-weight:700;font-size:13px}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.qrow{display:grid;gap:6px;padding:9px 0;border-bottom:1px solid var(--line2)}.qrow:last-child{border-bottom:0}
.matrix{display:grid;grid-template-columns:auto repeat(3,40px);grid-template-rows:repeat(3,36px) auto;gap:3px;align-self:start}
.mc{border-radius:6px;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap}
.mc.lo{background:var(--oks)}.mc.mid{background:var(--warns)}.mc.hi{background:var(--bads)}
.dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--ink);color:var(--panel);flex:none}
.ax{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;align-self:center;text-align:center}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
.tile.on{border-color:var(--acc);background:var(--accs)}
.tile b{font-size:13.5px}.tile .row{gap:6px}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:1fr 1fr auto;gap:6px;min-height:0}
.quad div.q{border-radius:10px;padding:10px;background:var(--sunk);font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;justify-content:center}
.quad div.q b{display:block;color:var(--ink);font-size:13.5px}
.quad div.q.on{background:var(--ink);color:var(--panel)}.quad div.q.on b{color:var(--panel)}
.sheet .cols{columns:2;column-gap:26px;font-size:12.8px;line-height:1.5;flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.sheet h4{margin:10px 0 3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2);break-after:avoid}
.sheet p,.sheet li{margin:0 0 3px}.sheet ul{margin:0;padding-left:17px}
.dark{background:var(--side);color:var(--sink);border-color:var(--side)}
.dark .btn{color:var(--ink)}.dark .mut{color:#c4c1ba}.dark .eyebrow{color:#f0a58e}.dark h2,.dark h3{color:#fff}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--side2);border-radius:10px;padding:10px}
.stat3 b{font-family:var(--display);font-size:24px;display:block;line-height:1.1;color:#fff}
.stat3 small{font-size:11.5px;color:#b9b6ae;line-height:1.3;display:block}
.flow4{display:grid;gap:8px}
.flow4 div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.flow4 .n{width:30px;height:30px;border-radius:9px;background:var(--accs);color:var(--acc2);display:grid;place-items:center;font-weight:800}
.flow4 b{font-size:13.5px}.flow4 small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.modal{position:fixed;inset:0;z-index:40;background:rgba(21,23,31,.5);display:grid;place-items:center;padding:16px;animation:fade .2s ease}
.modal .box{background:var(--panel);border-radius:16px;max-width:580px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.banner{background:var(--accs);color:var(--acc2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.center{display:grid;place-items:center;text-align:center}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-height:0}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:12.5px;overflow-wrap:anywhere;flex:1;min-width:0}
.bigcode{font-family:var(--display);font-size:40px;letter-spacing:.12em;font-weight:600;line-height:1}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tpl button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;text-align:left;font-size:12.5px;font-weight:600}
.tpl button small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
.tpl button[aria-pressed="true"]{border-color:var(--acc);background:var(--accs)}
.crit{width:100%;border-collapse:collapse;font-size:13px}
.crit th,.crit td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:center}
.crit th:first-child,.crit td:first-child{text-align:left}
.crit select{padding:3px 4px;font-size:12.5px;border-radius:7px}
.crit tr.tot td{font-weight:700;border-bottom:0}

/* ---------- 3D motion ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:perspective(1200px) rotateX(8deg) translateY(14px)}to{opacity:1;transform:none}}
.enter>.page>*,.enter>.page>.g2>*,.enter>.page>.g3>*{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.enter>.page>*:nth-child(2),.enter>.page>.g2>*:nth-child(2),.enter>.page>.g3>*:nth-child(2){animation-delay:.06s}
.enter>.page>*:nth-child(3),.enter>.page>.g3>*:nth-child(3){animation-delay:.12s}
.tilt{transition:transform .25s ease,box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
.scene{position:relative;perspective:1100px;perspective-origin:50% 30%;overflow:hidden;min-height:0}
.floor{position:absolute;left:50%;top:56%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(-38deg)}
.spin .floor{animation:spin 26s linear infinite}
@keyframes spin{from{transform:rotateX(60deg) rotateZ(-38deg)}to{transform:rotateX(60deg) rotateZ(322deg)}}
.plate{position:absolute;transform-style:preserve-3d;border-radius:50%}
.box{position:absolute;transform-style:preserve-3d}
.box .f{position:absolute;left:0;top:0;backface-visibility:visible}
.box.grow{animation:grow 1.1s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes grow{from{transform:var(--pos) scale3d(1,1,.02)}to{transform:var(--pos) scale3d(1,1,1)}}
.b3leg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12.5px;color:var(--ink2)}.b3leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.b3leg b{color:var(--ink);margin-left:2px}
.lbl3{position:absolute;transform-style:preserve-3d;white-space:nowrap;font-weight:700;font-size:12px;pointer-events:none}
.pulse{position:absolute;border-radius:50%;border:3px solid var(--acc);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:translateZ(2px) scale(.3);opacity:.9}100%{transform:translateZ(2px) scale(2.6);opacity:0}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateZ(var(--z,0px))}50%{transform:translateZ(calc(var(--z,0px) + 14px))}}
.flip{perspective:900px;border:0;background:none;padding:0;text-align:left;min-height:0;display:block;width:100%;height:100%}
.flip .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:10px 12px;border:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.flip .fc.back{transform:rotateY(180deg);background:var(--ink);color:var(--panel);border-color:var(--ink)}
.flip b{font-size:13px;line-height:1.25}.flip small{font-size:11.5px;line-height:1.3;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.flip .fc{padding:9px 10px}.flip .back small{color:#d9d6cf}
.flip .hintf{margin-top:auto;font-size:11px;color:var(--ink3)}
.drawer{position:fixed;inset:0;z-index:45;background:rgba(21,23,31,.35);display:flex;justify-content:flex-end;perspective:1400px;animation:fade .2s}
.drawer .dr{width:min(480px,100vw);height:100%;background:var(--panel);box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;padding:20px;overflow:auto;transform-origin:right center;animation:slide .45s cubic-bezier(.2,.85,.25,1)}
@keyframes slide{from{transform:rotateY(-18deg) translateX(60px);opacity:0}to{transform:none;opacity:1}}
.aitool{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* ---------- landing ---------- */
.landing{height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg)}

.lp-r .cap small{color:#b9b6ae;font-size:13px}
.legend{display:flex;gap:12px;font-size:12px;color:#d6d3cc}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

function api(method,path,bodyObj){
  return fetch('/api/'+path,{method:method,headers:{'content-type':'application/json'},body:bodyObj?JSON.stringify(bodyObj):undefined,cache:'no-store'})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||('Error '+r.status));e.status=r.status;throw e}return j})});
}
function qs(o){return Object.keys(o).map(function(k){return k+'='+encodeURIComponent(o[k])}).join('&')}
function authQ(){return ISMGR&&SES.key?qs({code:SES.code,key:SES.key}):qs({code:SES.code,mid:SES.mid,tok:SES.tok})}
function put(path){if(path.indexOf('people/')===0)DIRTY.me=true;else DIRTY.room=true;clearTimeout(FT);FT=setTimeout(flush,450)}
function flush(){
  if(INFL){FT=setTimeout(flush,300);return}
  if(SES.mode==='local'){saveLocal();DIRTY.room=DIRTY.me=false;return}
  var jobs=[],was={room:DIRTY.room,me:DIRTY.me};INFL=true;
  if(DIRTY.room&&ISMGR){DIRTY.room=false;jobs.push(api('PUT','room?'+qs({code:SES.code,key:SES.key}),{decisions:DEC,notes:NOTES}))}
  if(DIRTY.me&&PEOPLE[UID]){DIRTY.me=false;var me=PEOPLE[UID];jobs.push(api('PUT','member?'+(ISMGR&&SES.key?qs({code:SES.code,mid:SES.mid,key:SES.key}):qs({code:SES.code,mid:SES.mid,tok:SES.tok})),{d:me.d||{},done:me.done||{}}))}
  Promise.all(jobs).then(function(){INFL=false;if(!ONLINE){ONLINE=true;renderSide()}},function(e){INFL=false;
    if(was.room)DIRTY.room=true;if(was.me)DIRTY.me=true;ONLINE=false;renderSide();
    toast(e.status===403?'You do not have permission to save this.':'Could not save. Retrying…');if(e.status!==403)FT=setTimeout(flush,3000)});
}
function poll(){
  if(!SES||SES.mode!=='net'||document.hidden)return;
  api('GET','room?'+authQ()).then(function(r){
    ONLINE=true;AION=!!r.ai;TEAM=r.room.team||TEAM;
    var sig=JSON.stringify([r.room.decisions,r.room.notes,r.members,r.me]);
    if(sig===LASTSIG)return;LASTSIG=sig;
    if(!DIRTY.room&&!INFL){DEC=r.room.decisions||{};if(r.room.notes)NOTES=r.room.notes}
    if(r.members){var keep=DIRTY.me?PEOPLE[UID]:null;PEOPLE={};r.members.forEach(function(m){PEOPLE[m.mid]=m;NAMES[m.mid]=m.name});if(keep)PEOPLE[UID]=keep}
    if(r.me&&!DIRTY.me){PEOPLE[UID]=r.me;NAMES[UID]=r.me.name}
    softRender();
  }).catch(function(e){if(e.status===403){toast('This room link is no longer valid on this device.');leave();return}ONLINE=false;renderSide()});
}

function notesOf(id){if(!NOTES[id])NOTES[id]={};var n=NOTES[id];['concerns','assumptions','risks','guests','criteria'].forEach(function(k){n[k]=n[k]||[]});['ans','air','turns','scores'].forEach(function(k){n[k]=n[k]||{}});return n}

/* ============ names ============ */
function nm(id){if(!id)return 'Unassigned';if(id==='_mgr')return 'Manager';if(id.indexOf('g:')===0)return id.slice(2);var n=NAMES[id]||(PEOPLE[id]&&PEOPLE[id].name)||'Team member';return id===UID?n+' (you)':n}
function bare(id){return nm(id).replace(' (you)','')}
function initials(id){var p=bare(id).trim().split(/\s+/);return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function colorOf(id){var h=0;id=String(id);for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
function avatar(id,size){return '<span class="av" style="background:'+colorOf(id)+(size?';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.4)+'px':'')+'">'+esc(initials(id))+'</span>'}

/* ============ model ============ */
function optsOf(d){return (d&&d.options&&d.options.length)?d.options:DEFOPTS}
function optColor(d,id){if(OPTCOL[id])return OPTCOL[id];var i=optsOf(d).map(function(o){return o.id}).indexOf(id);return XCOL[Math.max(0,i)%XCOL.length]}
function optLabel(d,id){var o=optsOf(d).filter(function(x){return x.id===id})[0];return o?o.label:'–'}
function decList(){return Object.keys(DEC).map(function(k){return DEC[k]}).filter(function(d){return d&&d.title}).sort(function(a,b){return (b.created||0)-(a.created||0)})}
function members(){return Object.keys(PEOPLE).filter(function(k){return PEOPLE[k]&&PEOPLE[k].joined})}
function voters(id){return members().filter(function(m){var p=PEOPLE[m];return p.role!=='manager'||(p.d&&p.d[id]&&p.d[id].vote)})}
function inputsFor(id){return members().map(function(u){var x=PEOPLE[u].d&&PEOPLE[u].d[id];return x?{uid:u,x:x}:null}).filter(Boolean)}
function stageIdx(d){return STAGES.indexOf(d.stage||'share')}
function liveAgg(id){
  var d=DEC[id],ins=inputsFor(id),sh=ins.filter(function(i){return i.x.vote}),v={},tr={};
  optsOf(d).forEach(function(o){v[o.id]=0});
  sh.forEach(function(i){v[i.x.vote]=(v[i.x.vote]||0)+1});
  ins.forEach(function(i){(i.x.traps||[]).forEach(function(t){tr[t]=(tr[t]||0)+1})});
  var pick=function(k){return ins.filter(function(i){return (i.x[k]||'').trim()}).map(function(i){return {t:i.x[k].trim(),by:i.uid}})};
  var sa=sh.filter(function(i){return i.x.sa&&i.x.sa.every(function(z){return z>0})}).map(function(i){return avg(i.x.sa)});
  var vals=Object.keys(v).map(function(k){return v[k]}),mx=Math.max.apply(null,vals.concat([0])),n=sh.length,top=Object.keys(v).sort(function(a,b){return v[b]-v[a]})[0];
  return {n:n,team:voters(id).length,votes:v,conf:avg(sh.map(function(i){return i.x.conf||0})),safety:avg(sa),safeN:sa.length,
    know:pick('know'),why:pick('why'),pre:pick('pre'),concern:pick('concern'),mind:pick('mind'),traps:tr,top:n?mx/n:0,topId:top,
    challengers:ins.filter(function(i){return i.x.chTs}).length,answered:sh.map(function(i){return i.uid})};
}
function publicResults(id){var a=liveAgg(id),strip=function(l){return l.map(function(x){return x.t})};
  return {n:a.n,team:a.team,votes:a.votes,conf:a.conf,safety:a.safety,safeN:a.safeN,know:strip(a.know),pre:strip(a.pre),concern:strip(a.concern),mind:strip(a.mind),traps:a.traps,challengers:a.challengers,at:Date.now()}}
function challenges(id){
  var a=liveAgg(id),n=notesOf(id),out=[],d=DEC[id]||{};
  a.concern.forEach(function(c){out.push({key:c.by+':concern',kind:'Concern',text:c.t,by:c.by})});
  a.pre.forEach(function(c){out.push({key:c.by+':pre',kind:'Pre-mortem',text:c.t,by:c.by})});
  a.mind.forEach(function(c){out.push({key:c.by+':mind',kind:'Would change my mind',text:c.t,by:c.by})});
  n.concerns.forEach(function(c){out.push({key:'m:'+c.id,kind:c.kind||'Raised in meeting',text:c.text,by:c.by||'_mgr',own:true,id:c.id})});
  out.forEach(function(c){c.done=!!n.ans[c.key];c.anon=d.anonymous&&!c.own});
  return out;
}
function participants(id){var n=notesOf(id);return members().concat(n.guests.map(function(g){return 'g:'+g}))}
function evenness(id){var n=notesOf(id),ps=participants(id),tot=0;ps.forEach(function(k){tot+=n.air[k]||0});var N=ps.length;if(N<2||tot<60000)return null;var tv=0;ps.forEach(function(k){tv+=Math.abs((n.air[k]||0)/tot-1/N)});tv/=2;return Math.round(100*(1-tv/(1-1/N)))}
function gates(id){
  var d=DEC[id],a=liveAgg(id),n=notesOf(id),ch=challenges(id),open=ch.filter(function(c){return !c.done}).length,ev=evenness(id);
  var badA=n.assumptions.filter(function(x){return x.critical&&x.ev<2}).length,badR=n.risks.filter(function(r){return r.l*r.i>=6&&!r.undo&&!(r.fix||'').trim()}).length;
  var need=Math.max(2,Math.ceil(a.team*0.6));
  return [
   {k:'share',tab:'share',label:'Private views collected',ok:a.n>=need,d:a.n+' of '+a.team+' answered (need '+need+')'},
   {k:'safe',tab:'share',label:'It is safe to disagree',ok:a.safeN>=2&&a.safety>=3.5,d:a.safeN?('Safety '+a.safety.toFixed(1)+' / 5'):'Comes from the Share answers'},
   {k:'devil',tab:'challenge',sub:'dissent',label:'Someone argued the other side',ok:!!d.devil,d:d.devil?(bare(d.devil)+' is devil’s advocate'):'Assign a devil’s advocate'},
   {k:'answered',tab:'challenge',sub:'dissent',label:'Every challenge is answered',ok:ch.length>0&&open===0,d:ch.length?(open?open+' still open':'All '+ch.length+' answered'):'No challenges yet. Zero dissent is a warning sign'},
   {k:'assume',tab:'challenge',sub:'evidence',label:'Critical assumptions are backed',ok:n.assumptions.length>0&&badA===0,d:n.assumptions.length?(badA?badA+' critical with weak evidence':'Evidence is strong'):'List what must be true'},
   {k:'risk',tab:'challenge',sub:'evidence',label:'High risks have an answer',ok:n.risks.length>0&&badR===0,d:n.risks.length?(badR?badR+' high risk without a fix':'Every high risk is covered'):'Name what could go wrong'},
   {k:'heard',tab:'challenge',sub:'meeting',label:'Everyone was heard',ok:ev!==null&&ev>=60,d:ev===null?'Track who speaks in the meeting':'Airtime balance '+ev+'%'},
   {k:'trip',tab:'decide',label:'We know what would change our call',ok:(d.tripwire||'').trim().length>3,d:(d.tripwire||'').trim().length>3?'Tripwire written':'Write the tripwire'}
  ];
}
function score(id){var g=gates(id),n=g.filter(function(x){return x.ok}).length;return {n:n,of:g.length,pct:Math.round(100*n/g.length)}}
function scoreColor(s){return s.n===s.of?'var(--ok)':(s.n>=5?'var(--hold)':'var(--acc)')}
function alerts(id){
  var d=DEC[id],a=liveAgg(id),n=notesOf(id),out=[],ev=evenness(id),push=function(t,why,sev){out.push({t:t,tr:TRAPS[t],why:why,sev:sev})};
  if(a.n>=3&&a.top>=.85)push('groupthink',Math.round(a.top*100)+'% chose '+optLabel(d,a.topId)+(a.conf>=4?', with high confidence':''),'bad');
  if(a.n>=2&&a.conf>=4&&(a.pre.length===0||n.assumptions.some(function(x){return x.critical&&x.ev<2})))push('overconf','Confidence '+a.conf.toFixed(1)+'/5 but '+(a.pre.length?'critical assumptions are weak':'no pre-mortem yet'),'warn');
  if(a.safeN>=2&&a.safety<3.5)push('authority','Psychological safety is '+a.safety.toFixed(1)+'/5','bad');
  if(a.n>=2&&a.know.length<Math.ceil(a.n/2))push('hidden','Only '+a.know.length+' of '+a.n+' shared something others might not know','warn');
  if(ev!==null&&ev<60)push('anchor','One voice dominated the meeting (balance '+ev+'%)','warn');
  TRAP_IDS.forEach(function(t){var c=a.traps[t]||0;if(c>=2&&!out.some(function(o){return o.t===t}))push(t,c+' teammates flagged this','warn')});
  return out;
}
var addDays=function(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
var fmtD=function(s){if(!s)return '';var d=new Date(String(s).length===10?s+'T12:00:00':s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})};
var daysTo=function(s){return s?Math.max(1,Math.round((new Date(s+'T12:00:00')-new Date())/864e5)):30};
function suggestions(id){
  var d=DEC[id],out=[],g=function(k,t,src,days,owner){out.push({key:k,text:t,src:src,due:addDays(days),owner:owner||'_mgr'})},n=notesOf(id);
  challenges(id).filter(function(c){return !c.done}).slice(0,3).forEach(function(c){g('ch:'+c.key,'Answer the challenge: “'+c.text+'”','Challenge',3)});
  n.assumptions.filter(function(a){return a.critical&&a.ev<2}).slice(0,3).forEach(function(a){g('as:'+a.id,'Find evidence for: “'+a.text+'”','Assumption',7,d.devil||'_mgr')});
  n.risks.filter(function(r){return r.l*r.i>=6&&!r.undo&&!(r.fix||'').trim()}).slice(0,3).forEach(function(r){g('rk:'+r.id,'Prepare a fix or undo plan for: “'+r.text+'”','Risk',7)});
  alerts(id).slice(0,2).forEach(function(al){g('tr:'+al.t,al.tr.act,'Mind trap',3)});
  if(!d.devil)g('devil','Assign a devil’s advocate for the next discussion','Challenge',1);
  if(d.door==='one')g('pilot','Hard to undo: run a small pilot before full commitment','Risk',14);
  if((d.tripwire||'').trim())g('trip','Check the tripwire: '+d.tripwire.trim(),'Tripwire',daysTo(d.review));
  g('learn','Review the outcome with the team and record the lesson','Learn',daysTo(d.review));
  return out;
}
function genPlan(id){var d=DEC[id];d.plan=d.plan||[];var have={},add=0;d.plan.forEach(function(p){have[p.key]=1});
  suggestions(id).forEach(function(s){if(!have[s.key]){d.plan.push({id:rid(),key:s.key,text:s.text,src:s.src,owner:s.owner,due:s.due});add++}});saveDec(d);return add}
function taskDone(t){for(var u in PEOPLE){if(PEOPLE[u]&&PEOPLE[u].done&&PEOPLE[u].done[t.id])return true}return !!t.done}
function critTotals(id){var d=DEC[id],n=notesOf(id),W=n.criteria.reduce(function(s,c){return s+(+c.w||1)},0);
  return optsOf(d).map(function(o){var sc=n.scores[o.id]||{},t=0;n.criteria.forEach(function(c){t+=(+c.w||1)*(+sc[c.id]||0)});return {o:o,pct:W?Math.round(100*t/(W*5)):0}})}

/* ============ report ============ */
function outcomeLabel(o){if(!o)return '';return o.process==='good'?(o.result==='good'?'Earned success':'Bad luck'):(o.result==='good'?'Lucky outcome':'Avoidable failure')}
function reportMD(id,compact){
  var d=DEC[id],a=liveAgg(id),n=notesOf(id),g=gates(id),sc=score(id),L=[],lim=function(arr,k){return compact&&arr.length>k?arr.slice(0,k):arr},more=function(arr,k){if(compact&&arr.length>k)L.push('- +'+(arr.length-k)+' more in the full report')};
  var who=function(by){return d.anonymous?'':' ('+bare(by)+')'};
  L.push('# Decision report: '+d.title);
  L.push(new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+' · '+TEAM+' · Stage: '+STAGE_LABEL[d.stage||'share']+(d.anonymous?' · Anonymous input':''));
  if(d.question)L.push('**Question:** '+d.question);
  if(EXEC[id])L.push('**Summary:** '+EXEC[id]);
  L.push('');L.push('## Verdict');
  L.push(sc.n===sc.of?'Ready to decide: all '+sc.of+' checks are clear.':sc.n+' of '+sc.of+' checks are clear.'+(d.door==='one'?' This is hard to undo, so close the open checks first.':''));
  if(d.call)L.push('**Decision: '+optLabel(d,d.call)+'.**'+(d.reason?' '+d.reason:''));
  g.forEach(function(x){L.push('- '+(x.ok?'Clear':'Open')+': '+x.label+'. '+x.d)});
  L.push('');L.push('## Share: what individuals brought');
  if(a.n){L.push('Private vote ('+a.n+' of '+a.team+'): '+optsOf(d).map(function(o){return o.label+' '+(a.votes[o.id]||0)}).join(', ')+'. Confidence '+a.conf.toFixed(1)+'/5. Psychological safety '+(a.safeN?a.safety.toFixed(1)+'/5':'n/a')+'.');
    if(a.know.length){L.push('');L.push('What people knew that others might not:');lim(a.know,3).forEach(function(k){L.push('- '+k.t+who(k.by))});more(a.know,3)}}
  else L.push('No private views collected yet.');
  L.push('');L.push('## Challenge: what the team pushed back on');
  var ch=challenges(id);if(ch.length){lim(ch,4).forEach(function(c){L.push('- '+c.kind+': '+c.text+(c.anon?'':who(c.by))+' ['+(c.done?'answered':'OPEN')+']')});more(ch,4)}else L.push('No challenges raised.');
  if(d.devil)L.push('- Devil’s advocate: '+bare(d.devil));
  lim(n.assumptions,3).forEach(function(x){L.push('- Assumption: '+x.text+' [evidence: '+EV[x.ev]+(x.critical?', critical':'')+']')});
  lim(n.risks,3).forEach(function(r){L.push('- Risk: '+r.text+' (score '+r.l*r.i+'/9'+(r.undo?', can be undone':'')+((r.fix||'').trim()?', fix: '+r.fix:'')+')')});
  if(n.criteria.length){L.push('- Weighted criteria: '+critTotals(id).map(function(t){return t.o.label+' '+t.pct+'%'}).join(', '))}
  var al=alerts(id);if(al.length){L.push('');L.push('Mind traps detected:');al.slice(0,3).forEach(function(x){L.push('- '+x.tr.name+': '+x.why+'. Counter-move: '+x.tr.fix)})}
  L.push('');L.push('## Decide: what happens next');
  L.push('- Can we undo it: '+(d.door==='one'?'hardly (one-way door)':'easily (two-way door)'));
  L.push('- What would change our call: '+((d.tripwire||'').trim()||'not written yet'));
  if(d.review)L.push('- Review date: '+fmtD(d.review));
  var pl=d.plan||[];if(pl.length){lim(pl,5).forEach(function(p){L.push('- '+(taskDone(p)?'[done] ':'')+p.text+'. Owner: '+bare(p.owner)+'. Due '+fmtD(p.due))});more(pl,5)}
  if(d.outcome&&d.outcome.result){L.push('');L.push('## Learn');L.push('Outcome: '+d.outcome.result+'. Process: '+(d.outcome.process==='good'?'sound':'weak')+'. Verdict: '+outcomeLabel(d.outcome)+'.');if(d.outcome.lesson)L.push('Lesson: '+d.outcome.lesson)}
  L.push('');L.push('Method: private input before discussion, devil’s advocate, pre-mortem and balanced airtime. Woolley et al. (2010), Edmondson (1999), Klein (2007), Janis (1972).');
  return L.join('\n');
}
function mdHTML(t){var o=[],ul=false,cl=function(){if(ul){o.push('</ul>');ul=false}},inl=function(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')};
  t.split('\n').forEach(function(l){if(/^# /.test(l))return;if(/^## /.test(l)){cl();o.push('<h4>'+esc(l.slice(3))+'</h4>')}else if(/^- /.test(l)){if(!ul){o.push('<ul>');ul=true}o.push('<li>'+inl(l.slice(2))+'</li>')}else if(l.trim()){cl();o.push('<p>'+inl(l)+'</p>')}});cl();return o.join('')}

/* ============ AI (Claude via the site's function) with built-in fallback ============ */
function payloadOf(id){var d=DEC[id],a=liveAgg(id),n=notesOf(id),r=d.results||{};
  var votes={};optsOf(d).forEach(function(o){votes[o.label]=(ISMGR?a.votes[o.id]:(r.votes||{})[o.id])||0});
  return {title:d.title,question:d.question,context:d.context,options:optsOf(d).map(function(o){return o.label}),votes:votes,confidence:+(ISMGR?a.conf:(r.conf||0)).toFixed(1),
    safety:+(ISMGR?a.safety:(r.safety||0)).toFixed(1),whatPeopleKnow:(ISMGR?a.know.map(function(x){return x.t}):r.know||[]).slice(0,12),reasons:(ISMGR?a.why.map(function(x){return x.t}):[]).slice(0,12),
    challenges:(ISMGR?challenges(id).map(function(c){return c.kind+': '+c.text}):[]).slice(0,15),assumptions:n.assumptions.map(function(x){return x.text+' (evidence '+EV[x.ev]+')'}),
    risks:n.risks.map(function(x){return x.text}),tripwire:d.tripwire||'',decision:d.call?optLabel(d,d.call):'',undo:d.door==='one'?'hard':'easy'}}
function rules(task,id,extra){
  var d=DEC[id],a=liveAgg(id),top=optLabel(d,a.topId),pct=Math.round(a.top*100);
  if(task==='devil')return {arguments:[
     'The evidence for “'+top+'” may measure the wrong thing. What matters to the people who are not in our data?',
     a.n?pct+'% of the team chose '+top+'. Fast agreement can be groupthink, not proof.':'Nobody has voted yet, so the loudest early opinion may set the direction.',
     d.door==='one'?'This is hard to undo. If we are wrong, the cost lasts much longer than the benefit of moving fast.':'If this is easy to undo, are we testing it small enough first?'],
   questions:['What would we expect to see if '+top+' is the wrong call?','Who outside this team would disagree, and what do they know?','What is the cheapest test we can run before we commit?']};
  if(task==='scan'){var al=alerts(id);return {traps:al.map(function(x){return {id:x.t,evidence:x.why,fix:x.tr.fix}}),overall:al.length?al.length+' warning sign'+(al.length>1?'s':'')+' found in the answers.':'No clear warning signs in the answers so far.'}}
  if(task==='assume'){var t=TEMPLATES[d.template]||TEMPLATES.launch;return {assumptions:(t.as.length?t.as:TEMPLATES.launch.as).map(function(x){return {text:x[0],critical:x[1]}}).concat([{text:'The data we used reflects how people will really behave',critical:true}]),
     risks:(t.rk.length?t.rk:TEMPLATES.launch.rk).map(function(x){return {text:x[0],l:x[1],i:x[2]}})}}
  if(task==='plan')return {actions:suggestions(id).slice(0,6).map(function(s){return {text:s.text,days:Math.max(1,Math.round((new Date(s.due)-new Date())/864e5))}})};
  if(task==='summary'){var sc=score(id),g=gates(id).filter(function(x){return !x.ok});return {summary:(sc.n===sc.of?'The team looks ready: all '+sc.of+' checks are clear.':'The team is not ready yet: '+sc.n+' of '+sc.of+' checks are clear.')+(a.n?' '+a.n+' people voted privately and most chose '+top+'.':'')+(g.length?' The main open issue: '+g[0].label.toLowerCase()+'. Next step: '+g[0].d.toLowerCase()+'.':' Next step: publish the decision and its tripwire.')}}
  if(task==='coach'){var Q=['What do you know about this that the rest of the team might not?','What would have to be true for the opposite choice to be right?','If you had to bet your own money, would your confidence stay the same?','Who will be affected by this decision but is not in the room?','What evidence would change your mind?'];return {question:Q[(extra||0)%Q.length]}}
  return {};
}
function runAI(task,id,extra){
  var key=id+':'+task;AIBUSY[key]=true;render();
  var done=function(src,res){AIBUSY[key]=false;AIRES[id]=AIRES[id]||{};AIRES[id][task]={src:src,data:res};if(task==='summary'&&res.summary)EXEC[id]=res.summary;if(task==='coach')COACH[id]=res.question;render()};
  if(SES.mode!=='net'||!AION){setTimeout(function(){done('rules',rules(task,id,extra))},350);return}
  var body={code:SES.code,task:task,payload:task==='summary'?{report:reportMD(id,false)}:(task==='coach'?{question:DEC[id].question,myDraft:FORM[id]||{}}:payloadOf(id))};
  if(ISMGR&&SES.key)body.key=SES.key;else{body.mid=SES.mid;body.tok=SES.tok}
  api('POST','ai',body).then(function(r){done('ai',r.result||{})}).catch(function(e){toast(e.status===429?'Daily AI limit reached. Using built-in rules.':'AI unavailable. Using built-in rules.');done('rules',rules(task,id,extra))});
}

/* ============ UI helpers ============ */
function toast(m){document.querySelectorAll('.toast').forEach(function(e){e.remove()});var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function paged(arr,key,size){var p=UI.pg[key]||0,pages=Math.max(1,Math.ceil(arr.length/size));p=clamp(p,0,pages-1);UI.pg[key]=p;return {items:arr.slice(p*size,p*size+size),p:p,pages:pages,off:p*size}}
function pager(key,pg){return pg.pages>1?'<span class="pager"><button data-act="pg" data-k="'+key+'" data-d="-1" aria-label="Previous page">‹</button>'+(pg.p+1)+' / '+pg.pages+'<button data-act="pg" data-k="'+key+'" data-d="1" aria-label="Next page">›</button></span>':''}
function ring(s,cls){return '<div class="ring '+(cls||'')+'" style="--p:'+s.pct+';--c:'+scoreColor(s)+'" title="Readiness: '+s.n+' of '+s.of+' checks"><span>'+s.n+'/'+s.of+'</span></div>'}
function stagePill(d){var s=d.stage||'share',c={share:'blue',challenge:'acc',decide:'warn',decided:'ok',learned:''}[s];return '<span class="pill '+c+'"><i></i>'+STAGE_LABEL[s]+'</span>'}
function confirmed(key){if(UI.confirm[key]){delete UI.confirm[key];return true}UI.confirm[key]=1;setTimeout(function(){if(UI.confirm[key]){delete UI.confirm[key];render()}},3000);render();return false}

function fmtT(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function shade(hex,f){var c=hex.replace('#','');if(c.length!==6)return hex;var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);var m=function(x){return Math.round(clamp(f<1?x*f:x+(255-x)*(f-1),0,255))};return 'rgb('+m(r)+','+m(g)+','+m(b)+')'}
var CSSHEX={'var(--go)':'#2e9e6a','var(--hold)':'#d99a1c','var(--no)':'#d8492f','var(--acc)':'#e4572e'};
/* a CSS 3D box: x,y on the floor, w/d footprint, h height */
function box(x,y,w,dp,h,col,grow,extra){
  var c=CSSHEX[col]||col,pos='translate3d('+x+'px,'+y+'px,0)';
  return '<div class="box'+(grow?' grow':'')+'" style="--pos:'+pos+';transform:'+pos+';width:'+w+'px;height:'+dp+'px;'+(extra||'')+'">'+
   '<div class="f" style="width:'+w+'px;height:'+dp+'px;background:'+shade(c,1.12)+';transform:translateZ('+h+'px)"></div>'+
   '<div class="f" style="width:'+w+'px;height:'+h+'px;top:'+dp+'px;transform-origin:top;transform:rotateX(90deg);background:'+shade(c,.82)+'"></div>'+
   '<div class="f" style="width:'+w+'px;height:'+h+'px;transform-origin:top;transform:rotateX(90deg);background:'+shade(c,.92)+'"></div>'+
   '<div class="f" style="width:'+h+'px;height:'+dp+'px;transform-origin:left;transform:rotateY(-90deg);background:'+shade(c,.7)+'"></div>'+
   '<div class="f" style="width:'+h+'px;height:'+dp+'px;left:'+w+'px;transform-origin:left;transform:rotateY(-90deg);background:'+shade(c,.95)+'"></div></div>';
}
/* 3D bar chart: items [{label,v,col,t}] - the 3D part is visual, values sit in a 2D legend so nothing is clipped */
function bars3d(key,items,maxV,height,opts){
  opts=opts||{};var grow=!PLAYED[key];PLAYED[key]=1;var n=items.length,gap=opts.gap||26,w=opts.w||46,total=n*w+(n-1)*gap,hp=parseInt(height,10)||160,H=Math.min(opts.H||150,Math.round(hp*.55));
  var floor='<div class="plate" style="left:'+(-total/2-34)+'px;top:'+(-w/2-26)+'px;width:'+(total+68)+'px;height:'+(w+52)+'px;border-radius:14px;background:'+(opts.floor||'var(--sunk)')+';transform:translateZ(-1px)"></div>';
  var b=items.map(function(it,i){var h=Math.max(3,Math.round(H*(maxV?it.v/maxV:0)));var x=-total/2+i*(w+gap);return box(x,-w/2,w,w,h,it.col,grow,'animation-delay:'+(i*.09)+'s')}).join('');
  return '<div class="b3"><div class="scene'+(opts.spin?' spin':'')+'" style="height:'+hp+'px"><div class="floor" style="top:70%;transform:rotateX(56deg) rotateZ('+(opts.rz==null?-16:opts.rz)+'deg)">'+floor+b+'</div></div>'+
   '<div class="b3leg">'+items.map(function(it){return '<span><i style="background:'+(CSSHEX[it.col]||it.col)+'"></i>'+esc(it.label)+' <b class="num">'+esc(it.t!=null?it.t:it.v)+'</b></span>'}).join('')+'</div></div>';
}

   (EXEC[d.id]?'<div class="alert info"><span><b>Executive summary.</b> '+esc(EXEC[d.id])+'</span></div>':'')+'<div class="cols">'+mdHTML(reportMD(d.id,true))+'</div></div>'+

   '<button class="btn ai" data-act="ai" data-v="summary"'+(AIBUSY[d.id+':summary']?' disabled':'')+'>'+(AIBUSY[d.id+':summary']?'<span class="spinner"></span>Writing…':ic('spark')+'Executive summary')+'</button><div class="grow"></div><div class="small dim">'+(AION?'Summary written by Claude.':'Summary from built-in rules (AI is off).')+'</div></div></div>';

function tLearn(d){
  if(stageIdx(d)<3)return '<div class="panel center"><div style="max-width:420px;display:grid;gap:8px"><h2>Learn comes after the decision</h2><div class="mut">Publish the decision first. On the review date, come back here to judge the outcome and the process separately.</div></div></div>';
  var o=d.outcome||{},pr=o.process||(score(d.id).n>=6?'good':'poor'),res=o.result||'';
  var q=function(p,r,t,s){var on=res&&pr===p&&res===r;return '<div class="q'+(on?' on':'')+'"><b>'+t+'</b>'+s+'</div>'};
  return '<div class="g2"><div class="panel"><h3>What happened?</h3><div><label class="lab">The outcome</label><span class="seg"><button data-act="ores" data-v="good" aria-pressed="'+(res==='good')+'">Good outcome</button><button data-act="ores" data-v="bad" aria-pressed="'+(res==='bad')+'">Bad outcome</button></span></div>'+
   '<div><label class="lab">The process</label><span class="seg"><button data-act="oproc" data-v="good" aria-pressed="'+(pr==='good')+'">Sound</button><button data-act="oproc" data-v="poor" aria-pressed="'+(pr==='poor')+'">Weak</button></span><div class="small dim" style="margin-top:4px">Suggested from readiness when you published: '+(d.readyAt!=null?d.readyAt+' of 8 checks clear':'n/a')+'.</div></div>'+
   '<div><label class="lab" for="lesson">The lesson for next time</label><textarea class="field" id="lesson" rows="3" placeholder="Next time we will…">'+esc(o.lesson||'')+'</textarea></div><div class="row"><button class="btn pri" data-act="savelearn"'+(res?'':' disabled')+'>Save the lesson</button>'+(d.stage==='learned'?'<span class="pill ok">Saved · shared with the team</span>':'')+'</div></div>'+
   '<div class="panel"><h3>Judge the decision, not just the result</h3><div class="hint">A good process can meet bad luck. A bad process can get lucky. Only one of them is repeatable.</div><div class="quad grow"><span class="ax" style="writing-mode:vertical-rl;transform:rotate(180deg)">Sound process</span>'+q('good','good','Earned success','Repeat this process')+q('good','bad','Bad luck','Keep the process, review the risk')+'<span class="ax" style="writing-mode:vertical-rl;transform:rotate(180deg)">Weak process</span>'+q('poor','good','Lucky outcome','Do not copy this')+q('poor','bad','Avoidable failure','New Coke, 1985')+'<span></span><span class="ax">Good outcome</span><span class="ax">Bad outcome</span></div></div></div>';
}

/* ---- AI drawer ---- */
function aiDrawer(){
  var d=DEC[UI.dec];if(!d)return;var R=AIRES[d.id]||{};
  var src=function(r){return r?'<span class="src" style="color:'+(r.src==='ai'?'var(--acc2)':'var(--ink3)')+'">'+(r.src==='ai'?'✨ Claude AI':'Built-in rules')+'</span>':''};
  var tool=function(task,title,desc,res,actions){var busy=AIBUSY[d.id+':'+task];return '<div class="aitool"><div class="row between"><b>'+title+'</b><button class="btn sm ai" data-act="ai" data-v="'+task+'"'+(busy?' disabled':'')+'>'+(busy?'<span class="spinner"></span>':ic('spark'))+(res?'Run again':'Run')+'</button></div><div class="small mut">'+desc+'</div>'+(res?'<div class="aires">'+src(res)+res.html+(actions?'<div class="row">'+actions+'</div>':'')+'</div>':'')+'</div>'};
  var li=function(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(typeof x==='string'?x:(x.text||''))+'</li>'}).join('')+'</ul>'};
  var dv=R.devil&&{src:R.devil.src,html:'<b>Strongest case against</b>'+li(R.devil.data.arguments)+'<b>Unanswered questions</b>'+li(R.devil.data.questions)};
  var scn=R.scan&&{src:R.scan.src,html:'<div>'+esc(R.scan.data.overall||'')+'</div>'+((R.scan.data.traps||[]).length?'<ul>'+R.scan.data.traps.map(function(t){var tr=TRAPS[t.id]||{name:t.id};return '<li><b>'+esc(tr.name)+':</b> '+esc(t.evidence||'')+' <span class="dim">Fix: '+esc(t.fix||tr.fix||'')+'</span></li>'}).join('')+'</ul>':'')};
  var asm=R.assume&&{src:R.assume.src,html:'<b>Assumptions</b>'+li((R.assume.data.assumptions||[]).map(function(a){return a.text+(a.critical?' (critical)':'')}))+'<b>Risks</b>'+li((R.assume.data.risks||[]).map(function(r){return r.text}))};
  var pl=R.plan&&{src:R.plan.src,html:li((R.plan.data.actions||[]).map(function(a){return a.text+' · '+(a.days||7)+' days'}))};
  var sm=R.summary&&{src:R.summary.src,html:'<div>'+esc(R.summary.data.summary||'')+'</div>'};
  $('#layer').innerHTML='<div class="drawer" data-act="aiclose"><div class="dr" role="dialog" aria-label="AI assistant"><div class="row between"><div><div class="eyebrow">'+(AION?'Powered by Claude':'Built-in rules · AI is off')+'</div><h2>AI assistant</h2></div><button class="x" data-act="aiclose" aria-label="Close" style="font-size:22px">×</button></div>'+
   '<div class="small mut">Tools that attack the ways smart teams go wrong. The AI only sees the decision and anonymous answers, never names.</div>'+
   tool('devil','AI devil’s advocate','Argues against where the team is leaning. Fights groupthink and confirmation bias.',dv,dv?'<button class="btn sm" data-act="aiadd" data-v="devil">Add as challenges</button>':'')+
   tool('scan','Bias scan','Reads the private answers and challenges and looks for the six traps.',scn,scn&&(R.scan.data.traps||[]).length?'<button class="btn sm" data-act="aiadd" data-v="scan">Add counter-moves to plan</button>':'')+
   tool('assume','Hidden assumptions and risks','Lists what must be true and what could go wrong.',asm,asm?'<button class="btn sm" data-act="aiadd" data-v="assume">Add to Evidence</button>':'')+
   tool('plan','Draft the action plan','Turns the open gaps into concrete actions with dates.',pl,pl?'<button class="btn sm" data-act="aiadd" data-v="plan">Add to plan</button>':'')+
   tool('summary','Executive summary','Three sentences for your boss: ready or not, the main issue, the next step.',sm,'')+'</div></div>';
}

/* ---- team ---- */
function vTeam(){
  var ms=members(),pg=paged(ms,'team',7),decs=decList();
  var rows=pg.items.map(function(u){var p=PEOPLE[u],ans=decs.filter(function(d){return p.d&&p.d[d.id]&&p.d[d.id].vote}).length,tasks=0,dn=0;
    decs.forEach(function(d){(d.plan||[]).forEach(function(t){if(t.owner===u){tasks++;if(taskDone(t))dn++}})});
    var roles=decs.filter(function(d){return d.devil===u&&stageIdx(d)<3}).length;
    return '<tr><td><span class="row" style="flex-wrap:nowrap">'+avatar(u,26)+'<b>'+esc(nm(u))+'</b>'+(p.role==='manager'?'<span class="pill">Manager</span>':'')+'</span></td><td>'+fmtD(new Date(p.joined).toISOString())+'</td><td>'+ans+' / '+decs.length+'</td><td>'+dn+' / '+tasks+'</td><td>'+(roles?'<span class="pill acc">Devil’s advocate</span>':'')+'</td><td style="text-align:right">'+(p.role!=='manager'&&u!==UID?'<button class="btn ghost sm danger" data-act="rmmember" data-id="'+esc(u)+'">'+(UI.confirm['rm:'+u]?'Click again to remove':'Remove')+'</button>':'')+'</td></tr>'}).join('');
  var hist=decs.slice(0,5).reverse().map(function(d){var a=liveAgg(d.id);return {t:d.title,s:a.safeN?a.safety:0}});
  return head('Team',ms.length+' in the room')+
   '<div class="page g2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="panel"><div class="ph"><h2>Members</h2>'+pager('team',pg)+'</div>'+(ms.length?'<table class="t"><thead><tr><th>Name</th><th>Joined</th><th>Answered</th><th>Tasks done</th><th>Role</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nobody has joined yet.</div>')+
   '<div class="grow"></div><div class="small dim">People appear after they join with the room code. Remove deletes a person and their answers from this room.</div></div>'+
   '<div class="panel"><h3>Psychological safety by decision</h3><div class="hint">From the 3 Edmondson-style questions in every Share step. Below 3.5 is a warning.</div>'+(hist.length?bars3d('safety',hist.map(function(h,i){return {label:lh(h.t,12),v:h.s,t:h.s?h.s.toFixed(1):'–',col:h.s&&h.s<3.5?'#d8492f':'#2e9e6a'}}),5,'230px',{H:110,w:34,gap:22}):'<div class="empty">No answers yet.</div>')+'</div></div>';
}
/* ---- playbook ---- */
function vPlaybook(){
  return head('Playbook: how does a smart team make a bad decision?','The research behind this tool, from our presentation.')+
  '<div class="page g3" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)">'+
   '<div class="panel dark"><div class="eyebrow">Case study · 1985</div><h2>New Coke</h2><div class="mut small">A smart team with huge data made a famous bad call. The taste tests measured taste, not the bond with the brand.</div>'+
    '<div class="stat3"><div><b>~200k</b><small>taste tests said yes</small></div><div><b>1 in 10</b><small>testers reacted angrily</small></div><div><b>79</b><small>days until the original came back</small></div></div>'+
    '<div class="mut small"><b style="color:#fff">The lesson:</b> the warning signal existed. The process did not bring it to the table.</div><div class="grow"></div><div class="small" style="color:#9a978f">Sources: The Coca-Cola Company (company history); Pendergrast (1993) for the 1-in-10 figure.</div>'+(VIEWAS==='manager'?'<button class="btn" data-act="casestudy" style="align-self:flex-start">Practice this case with your team</button>':'')+'</div>'+
   '<div class="panel"><div class="ph"><h3>What made groups smarter</h3><span class="small dim">Woolley et al., Science (2010)</span></div>'+bars3d('woolley',WOOLLEY.map(function(w,i){return {label:w[0],v:w[1],t:'.'+String(Math.round(w[1]*100)),col:i===0?'#e4572e':i===1?'#d99a1c':'#8a8f9e'}}),.45,innerHeight<800?'120px':'165px',{H:innerHeight<800?70:100,w:30,gap:22,rz:-14})+
    '<div class="small mut">Even turn-taking and social sensitivity mattered more than the smartest member’s IQ (699 people, 192 groups; association, not causation).</div>'+
    '<h3>Six traps that catch smart teams <span class="dim small" style="font-weight:500">· tap to flip</span></h3><div class="g3" style="gap:8px;grid-template-rows:repeat(2,'+(innerHeight<800?'100px':'118px')+')">'+TRAP_IDS.map(function(t){var x=TRAPS[t];return '<button class="flip" data-act="flip" aria-pressed="false" aria-label="'+esc(x.name)+'"><span class="in"><span class="fc"><b>'+x.name+'</b><small>'+esc(x.q)+'</small><span class="hintf">Tap for the fix</span></span><span class="fc back"><b>Fix</b><small>'+esc(x.fix)+'</small><span class="hintf" style="color:#a9a69f">'+x.src+'</span></span></span></button>'}).join('')+'</div></div>'+

    '<div class="grow"></div><div class="alert info small"><span>“Good decisions depend on how knowledge is shared, challenged and used.”</span></div></div></div>';
}

   case 'delplan':d.plan=d.plan.filter(function(p){return p.id!==id});saveDec(d);break;
   case 'copyrep':copy(reportMD(d.id,false),'Report copied');return;
   case 'dlrep':dlFile(slug(d.title)+'-report.md',reportMD(d.id,false));return;
   case 'printrep':printReport(d.id);return;
   case 'aiopen':aiDrawer();return;
   case 'ai':runAI(v,d.id);return;
   case 'aiadd':aiAdd(v);break;
   case 'ores':d.outcome=Object.assign({process:score(d.id).n>=6?'good':'poor'},d.outcome||{},{result:v});saveDec(d);break;
   case 'oproc':d.outcome=Object.assign({},d.outcome||{},{process:v});saveDec(d);break;
   case 'savelearn':d.outcome=Object.assign({process:score(d.id).n>=6?'good':'poor'},d.outcome||{},{lesson:V('lesson').trim()});d.stage='learned';saveDec(d);toast('Lesson saved and shared with the team');break;
   /* team */
   case 'respond':UI.page='respond';UI.dec=id;UI.enter=true;break;
   case 'f':var f=form(UI.dec),kf=b.getAttribute('data-k');f[kf]=kf==='conf'?+v:v;break;
   case 'fsa':form(UI.dec).sa[+b.getAttribute('data-i')]=+v;break;
   case 'ftrap':var ff=form(UI.dec),ix=ff.traps.indexOf(v);if(ix>-1)ff.traps.splice(ix,1);else ff.traps.push(v);break;
   case 'coach':runAI('coach',UI.dec,Math.floor(Math.random()*5));return;
   case 'submitshare':submitForm('share');return;
   case 'submitch':submitForm('challenge');return;
   default:return;
  }
  render();
});
function addLocalPerson(){var name=(prompt('Name of the team member who will answer now:')||'').trim();if(!name){VIEWAS='manager';UID='m_local';render();return}
  var mid='u_'+rid();PEOPLE[mid]={mid:mid,name:name.slice(0,40),role:'member',joined:Date.now(),d:{},done:{}};NAMES[mid]=name;UID=mid;FORM={};COACH={};saveLocal();render()}
function submitForm(kind){
  var id=UI.dec,f=form(id),me=myDoc();if(!me.joined)me.joined=Date.now();var x=me.d[id]||{};
  if(kind==='share'){x.vote=f.vote;x.conf=f.conf;x.know=f.know.trim();x.why=f.why.trim();x.sa=f.sa.slice();x.ts=Date.now()}
  else{x.pre=f.pre.trim();x.concern=f.concern.trim();x.mind=f.mind.trim();x.traps=f.traps.slice();x.chTs=Date.now()}
  me.d[id]=x;saveMe();delete FORM[id];UI.page='inbox';UI.enter=true;render();toast(kind==='share'?'Sent. It stays sealed until the reveal.':'Challenge sent. Thank you for pushing back.');
}
document.addEventListener('change',function(ev){
  var e=ev.target,act=e.getAttribute('data-act'),id=e.getAttribute('data-id'),d=UI.dec&&DEC[UI.dec];
  if(e.id==='asw'){if(e.value==='__new'){addLocalPerson();return}UID=e.value;FORM={};COACH={};UI.page='inbox';render();return}
  if(e.id==='import'&&e.files&&e.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.app!=='decision-room'||!o.decisions)throw 0;DEC=o.decisions;NOTES=o.notes||{};put('decisions/x');toast('Backup restored');render()}catch(err){toast('That file is not a Decision Room backup')}};rd.readAsText(e.files[0]);return}
  if(e.id==='devil'&&d){d.devil=e.value||null;saveDec(d);render();return}
  if(!act||!d)return;var n=notesOf(d.id);
  if(act==='powner'||act==='pdue'){(d.plan||[]).forEach(function(p){if(p.id===id){if(act==='powner')p.owner=e.value;else p.due=e.value}});saveDec(d);return}
  if(act==='cw'){n.criteria.forEach(function(c){if(c.id===id)c.w=+e.value});saveNotes(d.id);render();return}
  if(act==='cs'){var o=e.getAttribute('data-o');n.scores[o]=n.scores[o]||{};n.scores[o][id]=+e.value;saveNotes(d.id);render();return}
});
document.addEventListener('change',function(ev){var e=ev.target;if(e.getAttribute('data-act')==='tdone'){var me=myDoc();if(e.checked)me.done[e.getAttribute('data-id')]=Date.now();else delete me.done[e.getAttribute('data-id')];saveMe();render()}});
document.addEventListener('input',function(ev){
  var e=ev.target,d=UI.dec&&DEC[UI.dec],f=e.getAttribute('data-f');
  if(f&&UI.page==='respond'){form(UI.dec)[f]=e.value;var sb=document.querySelector('[data-act="submitch"]');if(sb&&f==='pre')sb.disabled=!(e.value.trim().length>2);return}
  if(!d)return;
  if(e.id==='reason'){d.reason=e.value;saveDec(d)}
  else if(e.id==='trip'){d.tripwire=e.value;saveDec(d);renderSide()}
  else if(e.id==='review'){d.review=e.value;saveDec(d)}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#layer').innerHTML){closeModal();return}
  if(ev.key!=='Enter'||ev.target.tagName==='TEXTAREA')return;
  var map={newch:'addch',newas:'addas',newrk:'addrk',rkfix:'addrk',guest:'addguest',newcrit2:'addcrit','nd-t':'createdec','nd-q':'createdec','c-name':'docreate','c-team':'docreate','j-code':'dojoin','j-name':'dojoin'},a=map[ev.target.id];
  if(a){ev.preventDefault();var b=document.querySelector('[data-act="'+a+'"]');if(b)b.click()}
});
/* subtle 3D tilt */
document.addEventListener('pointermove',function(ev){var t=ev.target.closest&&ev.target.closest('.tilt');if(!t||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var r=t.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;t.style.transform='perspective(800px) rotateY('+(x*7)+'deg) rotateX('+(-y*7)+'deg) translateZ(4px)'});
document.addEventListener('pointerout',function(ev){var t=ev.target.closest&&ev.target.closest('.tilt');if(t&&!t.contains(ev.relatedTarget))t.style.transform=''});
function applyTheme(){var t=LS.get('dr.theme','auto');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
window.addEventListener('hashchange',route);
var rT;window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(function(){if(SES&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render()},200)});
applyTheme();route();
})();
</script>
